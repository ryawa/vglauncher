name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Override upstream tag (otherwise uses UPSTREAM_VERSION file)'
        required: false

permissions:
  contents: write   # needed to create the release

jobs:
  prepare:
    name: Prepare patched source
    runs-on: ubuntu-latest
    outputs:
      upstream_tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout fork repo
        uses: actions/checkout@v4

      - name: Resolve upstream tag
        id: resolve
        run: |
          if [ -n "${{ inputs.upstream_tag }}" ]; then
            TAG="${{ inputs.upstream_tag }}"
          else
            TAG=$(cat UPSTREAM_VERSION)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using upstream tag: $TAG"

      - name: Checkout upstream Prism
        uses: actions/checkout@v4
        with:
          repository: PrismLauncher/PrismLauncher
          ref: ${{ steps.resolve.outputs.tag }}
          path: prism
          submodules: recursive
          fetch-depth: 0   # needed so git am has history

      - name: Configure git identity
        working-directory: prism
        run: |
          git config user.email "ci@example.com"
          git config user.name "CI"

      - name: Apply patches
        working-directory: prism
        run: |
          shopt -s nullglob
          patches=(../patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No patches found — building vanilla upstream."
            exit 0
          fi
          echo "Applying ${#patches[@]} patch(es)..."
          git am --3way "${patches[@]}"

      - name: Upload patched source as artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-source
          path: prism
          include-hidden-files: true
          retention-days: 1

  build:
    name: Build (${{ matrix.artifact-name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-name: Linux
            cmake-preset: linux
            qt-version: 6.10.2
          - os: windows-2022
            artifact-name: Windows-MSVC
            cmake-preset: windows_msvc
            vcvars-arch: amd64
            qt-version: 6.10.2
          - os: macos-14
            artifact-name: macOS
            cmake-preset: macos_universal
            macosx-deployment-target: 12.0
            qt-version: 6.9.3

    runs-on: ${{ matrix.os }}
    env:
      BUILD_TYPE: Release
      CMAKE_PRESET: ${{ matrix.cmake-preset }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx-deployment-target }}

    steps:
      - name: Download patched source
        uses: actions/download-artifact@v4
        with:
          name: patched-source
          path: .

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          vcvars-arch: ${{ matrix.vcvars-arch }}
          qt-version: ${{ matrix.qt-version }}

      - name: Configure
        shell: bash
        run: cmake --preset "$CMAKE_PRESET"

      - name: Build
        shell: bash
        run: cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      - name: Get version
        id: version
        shell: bash
        run: |
          # use your tag if present, else short SHA
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="dev-$(git rev-parse --short HEAD || echo unknown)"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/package/linux
        with:
          version: ${{ steps.version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          qt-version: ${{ steps.setup-dependencies.outputs.qt-version }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/package/macos
        with:
          version: ${{ steps.version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/package/windows
        with:
          version: ${{ steps.version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.artifact-name }}
          path: |
            ./*.AppImage
            ./*.zip
            ./*.tar.gz
            ./*.dmg
            ./*.exe
          if-no-files-found: warn

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: build-*
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
